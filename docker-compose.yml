version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vault_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-vault_db}
      POSTGRES_USER: ${DB_USER:-vault_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vault_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vault_user} -d ${DB_NAME:-vault_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vault_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./vault_backend
      dockerfile: Dockerfile
    container_name: vault_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./vault_backend:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-c929a738c82df092b7405e3204ecfc43d0473a2153835ca893b8e7dfbd51a4aa}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=*
      - DB_NAME=${DB_NAME:-vault_db}
      - DB_USER=${DB_USER:-vault_user}
      - DB_PASSWORD=${DB_PASSWORD:-vault_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./vault_backend
      dockerfile: Dockerfile
    container_name: vault_celery
    restart: always
    command: celery -A vault_backend worker --loglevel=info
    volumes:
      - ./vault_backend:/app
    environment:
      - SECRET_KEY=${SECRET_KEY:-c929a738c82df092b7405e3204ecfc43d0473a2153835ca893b8e7dfbd51a4aa}
      - DEBUG=${DEBUG:-True}
      - DB_NAME=${DB_NAME:-vault_db}
      - DB_USER=${DB_USER:-vault_user}
      - DB_PASSWORD=${DB_PASSWORD:-vault_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
    depends_on:
      - web
      - redis

volumes:
  postgres_data:
